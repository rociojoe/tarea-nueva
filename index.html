<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <h1>Registro de Usuario</h1>
        <p class="subtitle">Completa los datos para crear tu cuenta</p>

        <form action="#" method="POST" id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre" 
                    placeholder="Ej: Juan Pérez"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="ejemplo@correo.com"
                    required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    required>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de nacimiento</label>
                <input 
                    type="date" 
                    id="fecha" 
                    name="fecha" 
                    required>
            </div>

            <div class="form-group">
                <label for="pais">País</label>
                <select id="pais" name="pais" required>
                    <option value="">Selecciona un país</option>
                    <option value="ar">Argentina</option>
                    <option value="mx">México</option>
                    <option value="es">España</option>
                    <option value="co">Colombia</option>
                    <option value="cl">Chile</option>
                </select>
            </div>

            <div class="form-group">
                <label>Género</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="genero" value="m" required>
                        Masculino
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="genero" value="f">
                        Femenino
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="genero" value="o">
                        Otro
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label>Intereses</label>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" name="intereses" value="tecnologia">
                        Tecnología
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="intereses" value="deportes">
                        Deportes
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="intereses" value="musica">
                        Música
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="comentarios">Comentarios</label>
                <textarea 
                    id="comentarios" 
                    name="comentarios" 
                    rows="4"
                    placeholder="Cuéntanos algo sobre ti..."></textarea>
            </div>

            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="terminos" required>
                    Acepto los <a href="#">términos y condiciones</a>
                </label>
            </div>

            <div class="button-group">
                <button type="submit" class="btn btn-primary">Registrarse</button>
                <button type="reset" class="btn btn-secondary">Limpiar</button>
            </div>
        </form>
    </div>
</body>
</html>
